<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.webmanifest"><title>小陈 POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#171717}.app{max-width:650px;margin:auto;padding:12px 12px 90px}.top{position:sticky;top:0;background:#f5f5f5;padding:8px 0;z-index:4}.title{font-size:22px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.tabs button,.btn{border:0;border-radius:12px;padding:12px;font-weight:700;background:white}.tabs .on,.primary{background:#111827;color:white}.card{background:white;border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 1px 4px #0001}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{border:1px solid #ddd;background:white;border-radius:14px;padding:13px;text-align:left;font-weight:800}.item small{display:block;color:#666;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}.chip{border:1px solid #ddd;background:#fafafa;border-radius:999px;padding:9px 11px}.chip.on{background:#111827;color:white;border-color:#111827}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.qty{display:flex;gap:8px;align-items:center}.qty button{width:38px;height:38px;border:0;border-radius:10px;font-size:20px}.total{font-size:24px;font-weight:900}.submit{width:100%;border:0;border-radius:14px;padding:16px;background:#111827;color:white;font-size:17px;font-weight:900}.danger{background:#fee2e2;color:#991b1b}.muted{color:#737373;font-size:13px}.order{border-left:5px solid #111827}.order h3{margin:0 0 6px}.big{font-size:26px;font-weight:900}.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat>div{background:white;border-radius:14px;padding:12px}.hide{display:none}input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:white}hr{border:0;border-top:1px solid #eee}
</style></head><body><div class="app">
<div class="top"><div class="title">小陈 POS</div><div class="tabs"><button data-tab="order" class="on">接单</button><button data-tab="queue">待做 <span id="qCount"></span></button><button data-tab="today">今日</button></div></div>
<section id="order"><div class="card"><b>选择餐点</b><div class="menu" id="menu"></div></div><div class="card"><b id="pickedName">先选择餐点</b><div id="customBody" class="muted" style="margin-top:8px">选择后才显示客制选项。</div></div><div class="card"><div class="row"><b>数量</b><div class="qty"><button id="minus">−</button><b id="qty">1</b><button id="plus">＋</button></div></div><hr><div class="chips" id="orderType"></div><div class="chips" id="payType"></div><input id="note" placeholder="特别备注（没有可不填）"><div class="row" style="margin:14px 0 8px"><span>本单</span><span class="total" id="total">RM0.00</span></div><button class="submit" id="submit">确认订单</button></div></section>
<section id="queue" class="hide"><div id="queueList"></div></section>
<section id="today" class="hide"><div class="stat"><div><span class="muted">营业额</span><div class="big" id="sales">RM0</div></div><div><span class="muted">订单</span><div class="big" id="orders">0</div></div><div><span class="muted">Cash</span><div class="big" id="cash">RM0</div></div><div><span class="muted">TNGO</span><div class="big" id="tngo">RM0</div></div><div><span class="muted">Grab</span><div class="big" id="grab">RM0</div></div><div><span class="muted">未收款</span><div class="big" id="unpaid">RM0</div></div></div><div class="card"><b>今日餐点数量</b><div id="breakdown"></div></div><div class="card"><button class="btn" id="export">导出今日 CSV</button></div></section></div>
<script>
const MENU=[{id:'white',name:'白咖喱面',p:8,large:9,kind:'noodle'},{id:'hokkien',name:'福建面',p:7,large:8,kind:'noodle'},{id:'lor',name:'当归卤面',p:7,large:8,kind:'noodle'},{id:'ccf',name:'猪肠粉',p:5,kind:'simple'},{id:'rice',name:'鸡饭',p:6,kind:'rice'},{id:'riceL',name:'L Shape 鸡饭',p:12,kind:'riceL'}];
const noodles=['黄面+米粉','黄面','米粉','粿条','快熟面 +RM0.50'],spicy=['普通辣','少辣','加辣'];
const rem={white:['猪血','豆芽','血蛤','鱿鱼','虾','长豆','薄荷','Laksa花','海鲜腐竹'],hokkien:['豆芽','雍菜','鱼饼','瘦肉片','虾','半颗卤蛋','炸葱头酥'],lor:['豆芽','鱼饼','鸡丝','炸葱头酥','半颗卤蛋','蒜米醋','鸡脚两只'],rice:['豆芽','半颗卤蛋'],riceL:['豆芽','半颗卤蛋']};
let s={p:null,size:'普通',noodle:'黄面+米粉',spicy:'普通辣',part:'鸡翅',rice:'无',addons:[],remove:[],qty:1,type:'堂食',pay:'Cash'},data=JSON.parse(localStorage.getItem('xc_orders_v3')||'[]');
const $=x=>document.querySelector(x),money=n=>'RM'+(+n).toFixed(2),day=()=>{let d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),a=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+a};
function chips(id,a,v,cb){$(id).innerHTML=a.map(x=>'<button class="chip '+(x===v?'on':'')+'">'+x+'</button>').join('');[...$(id).children].forEach(b=>b.onclick=()=>cb(b.textContent))}
function initMenu(){$('#menu').innerHTML=MENU.map(x=>'<button class="item" data-id="'+x.id+'">'+x.name+'<small>'+money(x.p)+(x.large?' / 大 '+money(x.large):'')+'</small></button>').join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>pick(b.dataset.id))}
function pick(id){s.p=MENU.find(x=>x.id===id);Object.assign(s,{size:'普通',noodle:'黄面+米粉',spicy:'普通辣',part:'鸡翅',rice:'无',addons:[],remove:[],qty:1});$('#pickedName').textContent=s.p.name;custom();calc()}
function group(n,a,k){return '<b>'+n+'</b><div class="chips" data-key="'+k+'">'+a.map(x=>'<button class="chip '+(s[k]===x?'on':'')+'">'+x+'</button>').join('')+'</div>'}
function custom(){let p=s.p,h='';if(p.kind==='noodle')h+=group('份量',['普通','大'],'size')+group('面类',noodles,'noodle')+group('辣度',spicy,'spicy');if(p.kind==='rice')h+=group('鸡部位',['鸡翅','鸡胸','鸡腿','鸡二度'],'part');if(p.kind==='rice'||p.kind==='riceL')h+=group('加油饭',['无','小油饭 +RM1.50','大油饭 +RM2.00'],'rice');if(rem[p.id])h+='<b>不要</b><div class="chips" data-multi="remove">'+rem[p.id].map(x=>'<button class="chip '+(s.remove.includes(x)?'on':'')+'">不要'+x+'</button>').join('')+'</div>';h+='<b>加料</b><div class="chips" data-multi="addons">'+['血蛤 +RM2','鱿鱼 +RM2','虾 +RM2','卤蛋 +RM2'].map(x=>'<button class="chip '+(s.addons.includes(x)?'on':'')+'">'+x+'</button>').join('')+'</div>';$('#customBody').innerHTML=h;document.querySelectorAll('[data-key]').forEach(g=>[...g.children].forEach(b=>b.onclick=()=>{s[g.dataset.key]=b.textContent;custom();calc()}));document.querySelectorAll('[data-multi]').forEach(g=>[...g.children].forEach(b=>b.onclick=()=>{let k=g.dataset.multi,v=b.textContent.replace(/^不要/,'');let i=s[k].indexOf(v);i<0?s[k].push(v):s[k].splice(i,1);custom();calc()}))}
function unit(){if(!s.p)return 0;let n=s.p.p;if(s.p.kind==='noodle'&&s.size==='大')n=s.p.large;if(s.p.kind==='noodle'&&s.noodle.startsWith('快熟面'))n+=.5;if(s.p.kind==='rice'&&(s.part==='鸡腿'||s.part==='鸡二度'))n=6.5;if(s.rice.startsWith('小'))n+=1.5;if(s.rice.startsWith('大'))n+=2;return n+s.addons.length*2}
function calc(){$('#qty').textContent=s.qty;$('#total').textContent=money(unit()*s.qty)}
function details(){let a=[];if(s.p.kind==='noodle')a.push(s.size,s.noodle,s.spicy);if(s.p.kind==='rice')a.push(s.part);if((s.p.kind==='rice'||s.p.kind==='riceL')&&s.rice!=='无')a.push(s.rice);a.push(...s.remove.map(x=>'不要'+x),...s.addons);let n=$('#note').value.trim();if(n)a.push(n);return a.join(' · ')}
function save(){localStorage.setItem('xc_orders_v3',JSON.stringify(data));queue();report()}
function setType(v){s.type=v;chips('#orderType',['堂食','打包','Grab'],v,setType)}function setPay(v){s.pay=v;chips('#payType',['Cash','TNGO','Grab','未收款'],v,setPay)}setType('堂食');setPay('Cash');
$('#minus').onclick=()=>{s.qty=Math.max(1,s.qty-1);calc()};$('#plus').onclick=()=>{s.qty++;calc()};
$('#submit').onclick=()=>{if(!s.p)return alert('先选择餐点');data.push({id:Date.now(),date:day(),time:new Date().toLocaleTimeString('zh-MY',{hour:'2-digit',minute:'2-digit'}),item:s.p.name,qty:s.qty,amount:unit()*s.qty,detail:details(),type:s.type,pay:s.pay,status:'pending'});save();s.p=null;s.qty=1;$('#pickedName').textContent='先选择餐点';$('#customBody').textContent='选择后才显示客制选项。';$('#note').value='';calc();show('queue')}
function queue(){let q=data.filter(x=>x.date===day()&&x.status==='pending');$('#qCount').textContent=q.length?'('+q.length+')':'';$('#queueList').innerHTML=q.length?q.map(x=>'<div class="card order"><div class="row"><h3>'+x.qty+'× '+x.item+'</h3><b>'+x.time+'</b></div><div>'+x.detail+'</div><div class="muted">'+x.type+' · '+x.pay+' · '+money(x.amount)+'</div><div class="row" style="margin-top:10px"><button class="btn danger" onclick="cancelO('+x.id+')">取消</button><button class="btn primary" onclick="done('+x.id+')">完成</button></div></div>').join(''):'<div class="card">目前没有待做订单。</div>'}
window.done=id=>{data.find(x=>x.id===id).status='done';save()};window.cancelO=id=>{if(confirm('确定取消？')){data.find(x=>x.id===id).status='cancelled';save()}}
function report(){let a=data.filter(x=>x.date===day()&&x.status!=='cancelled'),sum=k=>a.filter(x=>!k||x.pay===k).reduce((n,x)=>n+x.amount,0);$('#sales').textContent=money(sum());$('#orders').textContent=a.length;$('#cash').textContent=money(sum('Cash'));$('#tngo').textContent=money(sum('TNGO'));$('#grab').textContent=money(sum('Grab'));$('#unpaid').textContent=money(sum('未收款'));let m={};a.forEach(x=>m[x.item]=(m[x.item]||0)+x.qty);$('#breakdown').innerHTML=Object.entries(m).map(([k,v])=>'<div class="row"><span>'+k+'</span><b>'+v+'</b></div>').join('')||'<p class="muted">今天还没有订单。</p>'}
function show(id){['order','queue','today'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));if(id==='queue')queue();if(id==='today')report()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.tab));
$('#export').onclick=()=>{let a=data.filter(x=>x.date===day()),rows=[['时间','餐点','数量','金额','类型','付款','状态','详情'],...a.map(x=>[x.time,x.item,x.qty,x.amount,x.type,x.pay,x.status,x.detail])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),el=document.createElement('a');el.href=u;el.download='小陈POS_'+day()+'.csv';el.click();URL.revokeObjectURL(u)};
initMenu();calc();queue();report();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
