<!doctype html>
<html lang="zh-Hans"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小陈 POS</title><link rel="manifest" href="./manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#171717}
header{background:#111;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;font-size:20px;font-weight:800}
nav{display:flex;background:#fff;position:sticky;top:52px;z-index:4;border-bottom:1px solid #ddd}
nav button{flex:1;border:0;background:#fff;padding:13px 4px;font-size:16px;font-weight:700}.active{border-bottom:3px solid #111}
main{max-width:720px;margin:auto;padding:10px}.card{background:#fff;border-radius:13px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #00000012}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.menu button,.chip,.secondary{background:#fff;border:1px solid #ccc;border-radius:10px}
.menu button{padding:11px;text-align:left;min-height:58px;font-size:15px}.menu b{display:block}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:9px 11px;font-size:14px}.chip.on{background:#111;color:#fff;border-color:#111}
h3{margin:2px 0 10px}label{display:block;color:#666;font-size:13px;margin:10px 0 5px}
input{width:100%;padding:10px;border:1px solid #ccc;border-radius:9px;font-size:16px}.primary{width:100%;border:0;border-radius:10px;background:#111;color:#fff;padding:13px;font-size:16px;font-weight:800}
.secondary{padding:8px 10px}.danger{color:#b00020}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.line{border-top:1px solid #eee;margin:10px 0}
.small{font-size:13px;color:#666}.stat{font-size:24px;font-weight:800}.hide{display:none}.cart{border:1px solid #ddd;border-radius:10px;padding:9px;margin:8px 0}.item{border-bottom:1px solid #eee;padding:9px 0}.badge{display:inline-block;background:#eee;border-radius:20px;padding:2px 7px;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<header>小陈 POS</header>
<nav><button class="active" data-tab="order">接单</button><button data-tab="queue">待做</button><button data-tab="today">今日</button></nav>
<main>
<section id="order">
<div class="card"><h3>1. 选品项</h3><div id="menu" class="grid menu"></div></div>
<div class="card"><h3 id="title">2. 设置品项</h3>
<div id="sizeBox"><label>份量</label><div id="sizes" class="chips"></div></div>
<div id="noodleBox"><label>面类</label><div id="noodles" class="chips"></div></div>
<div id="spicyBox"><label>辣度</label><div id="spicy" class="chips"></div></div>
<div id="partBox" class="hide"><label>鸡饭部位</label><div id="parts" class="chips"></div></div>
<div id="removeBox"><label>不要配料</label><div id="removes" class="chips"></div></div>
<div id="addonBox"><label>加料</label><div id="addons" class="chips"></div></div>
<label>这个品项</label><div id="serve" class="chips"></div>
<label>数量</label><input id="qty" type="number" min="1" value="1">
<label>品项备注</label><input id="itemNote" placeholder="例如：汤分开">
<div class="line"></div><button id="add" class="primary">＋ 加入这张订单</button></div>
<div class="card"><h3>3. 这张订单</h3><div id="cart"></div>
<div class="row"><b>合计</b><span id="total" class="stat">RM0.00</span></div>
<label>付款</label><div id="pay" class="chips"></div>
<label>整单备注</label><input id="orderNote" placeholder="例如：同桌">
<div class="line"></div><button id="submit" class="primary">确认整张订单</button></div>
</section>
<section id="queue" class="hide"><div id="queueList"></div></section>
<section id="today" class="hide"><div class="stats"><div class="card"><div class="small">订单总额</div><div id="sales" class="stat"></div></div><div class="card"><div class="small">订单数</div><div id="count" class="stat"></div></div></div><div id="payStats" class="card"></div><div class="card"><h3>今日品项</h3><div id="itemStats"></div></div><button id="csv" class="secondary">导出今日 CSV</button></section>
</main>
<script>
const P=[
{id:'w',n:'白咖喱面',p:8,b:9,t:'n',r:['猪血','豆芽','血蛤','鱿鱼','虾','长豆','薄荷','Laksa花','海鲜腐竹']},
{id:'h',n:'福建面',p:7,b:8,t:'n',r:['豆芽','雍菜','鱼饼','瘦肉片','虾','半颗卤蛋','炸葱头酥']},
{id:'l',n:'当归卤面',p:7,b:8,t:'n',r:['豆芽','鱼饼','鸡丝','炸葱头酥','半颗卤蛋','蒜米醋','鸡脚两只']},
{id:'c',n:'猪肠粉',p:5,t:'s',r:[]},{id:'r',n:'鸡饭',p:6,t:'r',r:['豆芽','半颗卤蛋']},{id:'rl',n:'L Shape 鸡饭',p:12,t:'rl',r:['豆芽','半颗卤蛋']}];
const A=[['血蛤',2],['鱿鱼',2],['虾',2],['卤蛋',2]],$=x=>document.getElementById(x);
let s,cart=[],payment='Cash',orders=JSON.parse(localStorage.getItem('xc_orders_v4')||'[]');
function fresh(p=P[0]){s={p,size:'普通',noodle:'黄面+米粉',spicy:'普通辣',part:'鸡翅',serve:'堂食',rem:[],add:[]};$('qty').value=1;$('itemNote').value='';edit()}
function ch(id,a,sel,multi,fn){$(id).innerHTML='';a.forEach(x=>{let v=Array.isArray(x)?x[0]:x,b=document.createElement('button');b.className='chip '+((multi?sel.includes(v):sel===v)?'on':'');b.textContent=Array.isArray(x)?`${x[0]} +RM${x[1]}`:v;b.onclick=()=>fn(v);$(id).appendChild(b)})}
function menu(){$('menu').innerHTML='';P.forEach(p=>{let b=document.createElement('button');b.innerHTML=`<b>${p.n}</b>RM${p.p.toFixed(2)}${p.b?' / 大 RM'+p.b.toFixed(2):''}`;b.onclick=()=>fresh(p);$('menu').appendChild(b)})}
function edit(){let p=s.p;$('title').textContent='2. '+p.n;$('sizeBox').classList.toggle('hide',p.t!=='n');$('noodleBox').classList.toggle('hide',p.t!=='n');$('spicyBox').classList.toggle('hide',p.t!=='n');$('partBox').classList.toggle('hide',p.t!=='r');$('removeBox').classList.toggle('hide',!p.r.length);$('addonBox').classList.toggle('hide',p.t!=='n');
ch('sizes',['普通','大'],s.size,0,v=>{s.size=v;edit()});ch('noodles',['黄面+米粉','黄面','米粉','粿条','快熟面'],s.noodle,0,v=>{s.noodle=v;edit()});ch('spicy',['普通辣','少辣','加辣'],s.spicy,0,v=>{s.spicy=v;edit()});ch('parts',['鸡翅','鸡胸','鸡腿','鸡二度'],s.part,0,v=>{s.part=v;edit()});ch('removes',p.r,s.rem,1,v=>{s.rem=s.rem.includes(v)?s.rem.filter(x=>x!==v):[...s.rem,v];edit()});ch('addons',A,s.add,1,v=>{s.add=s.add.includes(v)?s.add.filter(x=>x!==v):[...s.add,v];edit()});ch('serve',['堂食','打包'],s.serve,0,v=>{s.serve=v;edit()})}
function price(){let p=s.p,v=p.p;if(p.t==='n'){if(s.size==='大')v=p.b;if(s.noodle==='快熟面')v+=.5;s.add.forEach(a=>v+=2)}if(p.t==='r'&&['鸡腿','鸡二度'].includes(s.part))v=6.5;return v}
function drawCart(){if(!cart.length)$('cart').innerHTML='<div class="small">还没有品项</div>';else $('cart').innerHTML=cart.map((x,i)=>`<div class="cart"><div class="row"><b>${x.n} ×${x.q}</b><b>RM${x.total.toFixed(2)}</b></div><div><span class="badge">${x.serve}</span></div><div class="small">${x.d}</div><button class="secondary danger" onclick="del(${i})">删除</button></div>`).join('');$('total').textContent='RM'+cart.reduce((a,x)=>a+x.total,0).toFixed(2)}
window.del=i=>{cart.splice(i,1);drawCart()};
$('add').onclick=()=>{let q=Math.max(1,+$('qty').value||1),d=[];if(s.p.t==='n')d.push(s.size,s.noodle,s.spicy);if(s.p.t==='r')d.push(s.part);if(s.rem.length)d.push('不要：'+s.rem.join('、'));if(s.add.length)d.push('加：'+s.add.join('、'));if($('itemNote').value.trim())d.push('备注：'+$('itemNote').value.trim());let u=price();cart.push({n:s.p.n,q,serve:s.serve,u,total:u*q,d:d.join(' · ')||'普通'});drawCart();$('itemNote').value='';$('qty').value=1}
function pay(){ch('pay',['Cash','TNGO','Grab','未收款'],payment,0,v=>{payment=v;pay()})}
$('submit').onclick=()=>{if(!cart.length)return alert('先加入品项');orders.push({id:Date.now(),at:new Date().toISOString(),status:'pending',payment,note:$('orderNote').value.trim(),items:[...cart],total:cart.reduce((a,x)=>a+x.total,0)});save();cart=[];$('orderNote').value='';drawCart();alert('已加入待做')}
function save(){localStorage.setItem('xc_orders_v4',JSON.stringify(orders));queue();today()}
function queue(){let q=orders.filter(o=>o.status==='pending');$('queueList').innerHTML=q.length?q.map(o=>`<div class="card"><div class="row"><b>#${String(o.id).slice(-4)}</b><b>RM${o.total.toFixed(2)}</b></div>${o.items.map(x=>`<div class="item"><b>${x.n} ×${x.q}</b> <span class="badge">${x.serve}</span><div class="small">${x.d}</div></div>`).join('')}<div class="small">${o.payment}${o.note?' · '+o.note:''}</div><div class="line"></div><div class="row"><button class="secondary danger" onclick="cancelO(${o.id})">取消</button><button class="primary" style="width:auto" onclick="doneO(${o.id})">完成</button></div></div>`).join(''):'<div class="card">没有待做订单</div>'}
window.doneO=id=>{orders.find(o=>o.id===id).status='done';save()};window.cancelO=id=>{if(confirm('确定取消？')){orders.find(o=>o.id===id).status='cancelled';save()}};
function dk(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){let t=orders.filter(o=>o.status!=='cancelled'&&dk(new Date(o.at||o.created))===dk()),sum=t.reduce((a,o)=>a+o.total,0);$('sales').textContent='RM'+sum.toFixed(2);$('count').textContent=t.length;let ps={Cash:0,TNGO:0,Grab:0,'未收款':0},it={};t.forEach(o=>{ps[o.payment]=(ps[o.payment]||0)+o.total;o.items.forEach(x=>it[x.n||x.name]=(it[x.n||x.name]||0)+(x.q||x.qty))});$('payStats').innerHTML=Object.entries(ps).map(x=>`<div class="row item"><b>${x[0]}</b><span>RM${x[1].toFixed(2)}</span></div>`).join('');$('itemStats').innerHTML=Object.entries(it).map(x=>`<div class="row item"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')||'暂无'}
$('csv').onclick=()=>{let t=orders.filter(o=>o.status!=='cancelled'&&dk(new Date(o.at||o.created))===dk()),r=[['订单','品项','数量','堂食/打包','金额','付款']];t.forEach(o=>o.items.forEach(x=>r.push([o.id,x.n||x.name,x.q||x.qty,x.serve,x.total,o.payment])));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.map(x=>x.join(',')).join('\n')],{type:'text/csv'}));a.download='小陈POS_'+dk()+'.csv';a.click()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['order','queue','today'].forEach(x=>$(x).classList.toggle('hide',x!==b.dataset.tab));queue();today()});
menu();fresh();pay();drawCart();queue();today();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
